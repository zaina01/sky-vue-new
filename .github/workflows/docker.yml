name: Container images

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  image:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sky-frontend:ci
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}
      - name: Nginx routing and upload smoke test
        run: bash deploy/docker-smoke.sh sky-frontend:ci
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE: ghcr.io/zaina01/sky-vue-new
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag sky-frontend:ci "$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  publish:
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        env:
          IMAGE: ghcr.io/zaina01/sky-vue-new
        run: |
          tags=(--tag "$IMAGE:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(--tag "$IMAGE:$GITHUB_REF_NAME")
          else
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
